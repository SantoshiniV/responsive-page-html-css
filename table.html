<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTable</title>
</head>
<body>
    <h1>Class Timetable</h1>
    <table border="1">
        <tr>
            <th>DAY</th>
            <th>SUBJECT</th>
            <th>TIME</th>
        </tr>
        <tr>
         <td>Monday</td>
            <td>Maths</td>
            <td>9:00AM-10:00AM</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>Science</td>
            <td>10:00AM-11:00AM</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>English</td>
            <td>11:00AM-12:00PM</td>
        </tr>
        <tr>
            <td>Thursday</td>
            <td>History</td>
            <td>1:00PM-2:00PM</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>Geography</td>
            <td>2:00PM-3:00PM</td>
        </tr>
        <tr>
            <td>Saturday</td>
            <td>Computer Science</td>
            <td>3:00PM-4:00PM</td>
        </tr>
    </table>

</body>
</html>
