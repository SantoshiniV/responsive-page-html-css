<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <center>
    <h1> Student Registration Form </h1>
    <form>
        <label for="Student"> Enter name </label>
        <input id="Student" type="text" placeholder="Enter Your Name" > <br><br>
        <label for="email"> Enter email </label>
        <input id="email" type="email" placeholder="abc@gmail.com"> <br><br>
        <label for="password"> Enter password</label>
        <input id="password" type="password" placeholder="Enter your Password"> <br><br>
        <label for="gender"> Select Gender </label> <br>
        <label for="male"> Male</label>
        <input type="radio" id="male" name="gender"> 
        <label for="female"> Female</label>
        <input type="radio" id="female" name="gender"> 
        <label for="other"> Other</label>
        <input type="radio" id="other" name="gender"> <br><br>
        <label for="Department"> Select Department </label>
        <select>
            <option>BBA</option>
            <option>BCA</option>
            <option>BCom</option>
            <option>BSC</option>
            <option>BCS</option>
        </select> </br><br>
        <label for="address">Enter Address</label><br>
        <textarea name="Address" id="Address" cols="40" rows="5" placeholder="Enter your Address"> </textarea> <br><br>       
        <button>Submit</button>             
    </form>
</center>
</body>
</html>
